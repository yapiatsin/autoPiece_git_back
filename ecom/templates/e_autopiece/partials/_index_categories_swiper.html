{% load static i18n %}
{% for cat in ecom_categories %}
<div class="swiper-slide">
    <a href="{% url 'ecom_shop' %}?categorie={{ cat.pk }}" class="single-category-one">
        {% if cat.image %}
        <img src="{{ cat.image.url }}" alt="{{ cat.categorie }}">
        {% else %}
        <span class="ecom-cat-swiper-icon"><i class="fa-solid fa-gears"></i></span>
        {% endif %}
        <p>{{ cat.categorie }}</p>
    </a>
</div>
{% empty %}
<div class="swiper-slide">
    <p class="text-muted mb-0 px-2">{% trans "Aucune catégorie disponible." %}</p>
</div>
{% endfor %}
