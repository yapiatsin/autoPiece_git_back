{% extends 'page/base_compt.html' %}

{% block title %}Mot de passe oublié — AUTO-PIECE{% endblock title %}

{% block auth_content %}
<h1 class="auth-panel__title">Mot de passe oublié</h1>
<p class="auth-panel__subtitle">Un code OTP à 6 chiffres vous sera envoyé par email (valide 5 min).</p>

<form action="{% url 'request_email' %}" method="post" novalidate>
    {% csrf_token %}
    <div class="auth-form-group">
        <input type="email" class="auth-input" name="email" id="Email" placeholder="Email" required autocomplete="email">
    </div>
    <button type="submit" class="auth-btn-primary">Envoyer le code</button>
</form>
<p class="auth-footer-text">
    <i class="fa fa-arrow-left"></i> Retour à la
    <a href="{% url 'connexion' %}" class="auth-link">Connexion</a>
</p>
{% endblock auth_content %}
