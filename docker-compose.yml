# Pile de production Auto-Piece — a deployer dans /opt/autopiece sur le VPS.
#
#   docker compose pull && docker compose up -d
#
# Les services s'appellent `autopiece_web` et `autopiece_db`, et non `web` /
# `db`, parce qu'ils partagent le reseau du Caddy deja en place sur le VPS.
# Celui-ci sert deja une autre application dont le service se nomme `web` : deux
# conteneurs portant le meme nom sur un meme reseau se partageraient l'alias DNS
# et Caddy enverrait une partie du trafic au mauvais service.
#
# Le port 8000 n'est publie que sur 127.0.0.1:8010, pour les sondes et le
# depannage depuis le VPS. Le trafic public passe par Caddy, qui joint le
# conteneur par son nom sur le reseau partage. Voir deploy/Caddyfile.example.

services:
  autopiece_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autopiece}
      POSTGRES_USER: ${DB_USER:-autopiece}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      # Encodage et tri fixes : evite les divergences d'index entre machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Depot des dumps produits par scripts/backup_db.sh
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autopiece} -d ${DB_NAME:-autopiece}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autopiece

  autopiece_web:
    # Image publiee par GitHub Actions sur GHCR. `build` sert au premier
    # deploiement et au depannage (docker compose up -d --build).
    image: ${WEB_IMAGE:-ghcr.io/yapiatsin/autopiece_git_back:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      autopiece_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Force la configuration production quelles que soient les valeurs du .env
      # heritees du poste de developpement.
      DB_ENGINE: postgresql
      DB_HOST: autopiece_db
      DB_PORT: "5432"
      MEDIA_ROOT: /app/media
    volumes:
      # Uploads utilisateurs : doivent survivre a chaque redeploiement.
      # Le conteneur tourne en uid 1000 et un bind mount conserve les
      # permissions de l'hote : ce dossier doit lui appartenir, sinon
      # l'application ne peut plus enregistrer d'image.
      #   chown -R 1000:1000 /opt/autopiece/media
      - ./media:/app/media
      # `staticfiles` n'est volontairement PAS monte : collectstatic ecrit dans
      # le conteneur et WhiteNoise sert les fichiers depuis la. Un montage
      # supplementaire n'apporterait rien tant que Caddy ne sert pas /static en
      # direct, et ajouterait le meme piege de permissions.
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - autopiece
      - caddy

volumes:
  pgdata:

networks:
  # Reseau prive de la pile : seul autopiece_web joint la base.
  autopiece:
    driver: bridge

  # Reseau du Caddy deja en service sur le VPS. Il n'est pas cree ici : le nom
  # exact se renseigne dans CADDY_NETWORK, cote .env.
  caddy:
    external: true
    name: ${CADDY_NETWORK:?CADDY_NETWORK manquant dans .env}
