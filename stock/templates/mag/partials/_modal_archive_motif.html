<div class="modal fade" id="archiveMotifModal" tabindex="-1" role="dialog" aria-labelledby="archiveMotifModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="archiveMotifForm" method="post" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="archiveMotifModalLabel">
                        <i class="fa fa-archive text-warning"></i> Archiver la pièce
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Fermer">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="mb-2 text-muted small">Pièce concernée :</p>
                    <p class="font-weight-bold mb-3" id="archiveMotifPieceLabel">—</p>
                    <div class="form-group mb-0">
                        <label for="archiveMotifInput">Motif d'archivage <span class="text-danger">*</span></label>
                        <textarea
                            class="form-control"
                            id="archiveMotifInput"
                            name="archive_motif"
                            rows="3"
                            maxlength="500"
                            required
                            placeholder="Indiquez la raison de l'archivage…"></textarea>
                        <small class="form-text text-muted">Obligatoire pour confirmer l'archivage.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-warning">
                        <i class="fa fa-archive"></i> Archiver
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
