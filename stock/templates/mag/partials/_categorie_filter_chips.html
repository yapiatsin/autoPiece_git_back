{# Filtres catégories — catalogue panier / proforma #}
<nav class="piece-cat-filters" aria-label="Filtrer par catégorie">
    <button type="button"
            class="piece-cat-chip is-active"
            data-categorie=""
            onclick="filterByCategorie('')">
        <i class="fa fa-th-large" aria-hidden="true"></i>
        <span>Toutes</span>
    </button>
    {% for cat in categories %}
    <button type="button"
            class="piece-cat-chip"
            data-categorie="{{ cat.id }}"
            onclick="filterByCategorie('{{ cat.id }}')"
            title="{{ cat.categorie }}">
        <span>{{ cat.categorie }}</span>
    </button>
    {% endfor %}
</nav>
<nav class="piece-cat-filters piece-subcat-filters mt-1" id="piece-subcat-filters" aria-label="Filtrer par sous-catégorie">
    {% for cat in categories %}
        {% for sc in cat.sous_categories.all %}
        <button type="button"
                class="piece-cat-chip piece-subcat-chip d-none"
                data-parent="{{ cat.id }}"
                data-sous="{{ sc.id }}"
                onclick="filterBySousCategorie('{{ sc.id }}')"
                title="{{ sc.nom }}">
            <span>{{ sc.nom }}</span>
        </button>
        {% endfor %}
    {% endfor %}
</nav>
