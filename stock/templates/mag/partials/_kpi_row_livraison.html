<div class="mag-cmd-kpi-grid mag-cmd-kpi-grid--4">
    <article class="mag-stat-card">
        <div class="mag-stat-card-top">
            <div class="mag-stat-heading">
                <span class="mag-stat-icon"><i class="fa fa-list-alt"></i></span>
                <p class="mag-stat-label">Total commande</p>
            </div>
        </div>
        <div class="mag-stat-card-bottom">
            <strong class="mag-stat-value">{{ tot_panier_day }}</strong>
            <svg class="mag-stat-spark" viewBox="0 0 88 28" aria-hidden="true">
                <polyline fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="0,20 12,16 24,18 36,10 48,13 60,7 72,9 88,4"></polyline>
            </svg>
        </div>
        <span class="mag-stat-hint">{{ Date|date:"d-m-Y" }}</span>
    </article>
    <article class="mag-stat-card">
        <div class="mag-stat-card-top">
            <div class="mag-stat-heading">
                <span class="mag-stat-icon"><i class="fa fa-clock-o"></i></span>
                <p class="mag-stat-label">Commandes en attente</p>
            </div>
        </div>
        <div class="mag-stat-card-bottom">
            <strong class="mag-stat-value">{{ tot_en_at }}</strong>
            <svg class="mag-stat-bars" viewBox="0 0 52 28" aria-hidden="true">
                <rect x="2" y="16" width="6" height="12" rx="1.5"></rect>
                <rect x="12" y="10" width="6" height="18" rx="1.5"></rect>
                <rect x="22" y="14" width="6" height="14" rx="1.5"></rect>
                <rect x="32" y="6" width="6" height="22" rx="1.5"></rect>
                <rect x="42" y="11" width="6" height="17" rx="1.5"></rect>
            </svg>
        </div>
        <span class="mag-stat-hint">{{ Date|date:"d-m-Y" }}</span>
    </article>
    <article class="mag-stat-card">
        <div class="mag-stat-card-top">
            <div class="mag-stat-heading">
                <span class="mag-stat-icon"><i class="fa fa-truck"></i></span>
                <p class="mag-stat-label">Commandes livrées</p>
            </div>
        </div>
        <div class="mag-stat-card-bottom">
            <strong class="mag-stat-value">{{ tot_livre }}</strong>
            <svg class="mag-stat-spark" viewBox="0 0 88 28" aria-hidden="true">
                <polyline fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="0,22 14,18 28,20 42,12 56,14 70,8 88,6"></polyline>
            </svg>
        </div>
        <span class="mag-stat-hint">{{ Date|date:"d-m-Y" }}</span>
    </article>
    <article class="mag-stat-card">
        <div class="mag-stat-card-top">
            <div class="mag-stat-heading">
                <span class="mag-stat-icon"><i class="fa fa-calendar"></i></span>
                <p class="mag-stat-label">Livrées ce mois</p>
            </div>
        </div>
        <div class="mag-stat-card-bottom">
            <strong class="mag-stat-value">{{ tot_mens_livre }}</strong>
            <svg class="mag-stat-bars" viewBox="0 0 52 28" aria-hidden="true">
                <rect x="2" y="14" width="6" height="14" rx="1.5"></rect>
                <rect x="12" y="8" width="6" height="20" rx="1.5"></rect>
                <rect x="22" y="12" width="6" height="16" rx="1.5"></rect>
                <rect x="32" y="4" width="6" height="24" rx="1.5"></rect>
                <rect x="42" y="10" width="6" height="18" rx="1.5"></rect>
            </svg>
        </div>
        <span class="mag-stat-hint">{{ mois }}</span>
    </article>
</div>
