{% load custom_filters %}
{% if items %}
    {% for item in items %}
        <div class="card" id="article-card-{{ item.piece.pk }}" style="border-radius:18px; box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 4px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;">
            <div class="body">
                <div class="row">
                    <div class="preview col-lg-4 col-md-12">
                        <div class="preview-pic tab-content">
                            <div class="tab-pane active d-flex justify-content-center align-items-center" id="product_{{ item.piece.pk }}" style="height: 130px; border-radius:18px; background-color: #f8f7f7ff; overflow: hidden;">
                                {% if item.piece.image %}
                                    <img src="{{ item.piece.image.url }}" alt="{{ item.piece.designation }}" class="img-fluid" style="max-height: 120px; max-width: 100%; object-fit: contain;">
                                {% else %}
                                    <span class="icon-settings text-muted" style="font-size: 80px;"></span>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                    <div class="details col-lg-8 col-md-12">
                        <h3 class="product-title mb-0 font-15">{{ item.piece.designation }}</h3>
                        <h3 class="product-title mb-0 font-12 float-right">{{ item.piece.categorie.categorie }}</h3>
                        <hr>
                        <h5 class="colors">
                            <a href="javascript:void(0);" onclick="panierAction({{ item.piece.pk }}, 'decrement')" class="btn btn-default" type="button"><span class="fa fa-minus"></span></a>
                            <button class="btn btn-default" type="button"><span class="fa" id="quantite-{{ item.piece.pk }}">{{ item.quantite }}</span></button>
                            <a href="javascript:void(0);" onclick="panierAction({{ item.piece.pk }}, 'increment')" class="btn btn-default" type="button"><span class="fa fa-plus"></span></a>
                            <span class="float-right"><a href="javascript:void(0);" onclick="panierAction({{ item.piece.pk }}, 'delete')" class="btn btn-danger float-right" type="button"><span class="icon-trash"></span></a></span>
                        </h5>
                        <hr>
                        <h3 id="quantite-total-piece-{{ item.piece.pk }}" class="product-title mb-0 font-12 float-right">{{ item.prix_total }}</h3>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
{% endif %}
